name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests need no camera, GPIO, or YOLO, so skip the heavy packages.
      - run: pip install numpy pandas scikit-learn xgboost pyyaml pytest
      - run: pytest -q
