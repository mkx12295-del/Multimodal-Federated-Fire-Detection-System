# Fire node runtime configuration. Override any value with --config <file>.

node:
  id: node                # name used in alerts

models:
  sensor_type: xgboost    # xgboost | fl_mlp (federated model from federated/client.py)
  sensor: models/sensor_xgb.json
  sensor_fl: models/fl_node.npz
  vision: models/vision_yolo11n.pt

vision:
  enabled: true
  camera_index: 0
  width: 320
  height: 240
  imgsz: 416
  conf_threshold: 0.35
  # Only these classes count as hazard evidence; "other" is ignored.
  hazard_classes: [fire, smoke]

sensor:
  # Readings used to learn the clean-air gas-resistance baseline at startup.
  burn_in_samples: 30
  # Used when no BME680 is attached: replay a recorded CSV instead.
  replay_csv: smoke_detection_iot.csv
  replay_session: null    # replay one recording session only
  replay_start_fraction: 0.0

fusion:
  sensor_weight: 0.5
  vision_weight: 0.5
  sensor_threshold: 0.5
  vision_threshold: 0.35
  ema_alpha: 0.4          # temporal smoothing of the fused score
  warning_on: 0.35
  alarm_on: 0.6
  clear_below: 0.25
  alarm_frames: 3         # consecutive frames above alarm_on before ALARM
  confirm_frames: 2       # consecutive frames with both modalities agreeing before ALARM
  clear_frames: 5         # consecutive frames below clear_below before returning to NORMAL

reasoning:
  enabled: true
  backend: auto           # llama_cpp | transformers | ollama | rules | auto
  model_path: models/qwen2.5-0.5b-instruct-q4_k_m.gguf
  prompt: zero_shot       # zero_shot | few_shot
  ollama_model: qwen2.5:0.5b
  threads: 4
  window: 30              # readings summarized for each request
  cooldown_s: 30          # minimum gap between requests
  escalate: false         # off: the 0.5B model failed validation (see README); explanations only
  escalate_confidence: 0.8
  log_jsonl: logs/incidents.jsonl

hardware:
  buzzer_pin: 27          # physical pin 13
  relay_pin: 17           # physical pin 11

loop:
  interval_s: 1.0
  log_csv: logs/events.csv
